<script>
// Language switch: show Python, R, or both columns. The choice is remembered in this browser.
(function () {
  // Pages marked "both-languages" (Lab 1) always show Python and R, with no switch.
  if (document.body.classList.contains("both-languages")) return;
  const cols = document.querySelectorAll(".two-col > div");
  if (!cols.length) return;
  cols.forEach(d => {
    const tag = d.querySelector(":scope > p > .lang-tag, :scope > .lang-tag, .lang-tag");
    if (tag && tag.classList.contains("py")) d.classList.add("col-py");
    if (tag && tag.classList.contains("r")) d.classList.add("col-r");
  });
  const bar = document.createElement("div");
  bar.className = "lang-switch";
  bar.innerHTML = '<span class="lang-switch-label">Show code in:</span>' +
    '<button type="button" data-lang="py">Python</button>' +
    '<button type="button" data-lang="r">R</button>' +
    '<button type="button" data-lang="both">Both</button>';
  const header = document.querySelector("#title-block-header") || document.querySelector("main h1");
  (header ? header : document.querySelector("main")).insertAdjacentElement(header ? "afterend" : "afterbegin", bar);
  function apply(lang) {
    document.body.classList.remove("show-py", "show-r");
    if (lang === "py") document.body.classList.add("show-py");
    if (lang === "r") document.body.classList.add("show-r");
    bar.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
    try { localStorage.setItem("data405-lang", lang); } catch (e) {}
    window.dispatchEvent(new Event("resize"));   // let the code editors redraw at the new width
  }
  bar.addEventListener("click", e => { if (e.target.dataset.lang) apply(e.target.dataset.lang); });
  let saved = "both";
  try { saved = localStorage.getItem("data405-lang") || "both"; } catch (e) {}
  apply(saved);
})();
</script>
