project:
  type: website
  output-dir: docs
  resources:
    - data/**
    - downloads/**
    - images/**

website:
  title: "DATA405/BIOL480 · Lab Sessions"
  description: "Genomic Data Science (DATA405/BIOL480), Howard University, Fall 2026: lecture notes and labs with Python and R"
  page-navigation: true
  navbar:
    background: "#0070C0"
    left:
      - href: index.qmd
        text: Home
      - text: "Lab 1"
        menu:
          - href: lab1.qmd
            text: "Lab 1 · Python and R on real chr22 data"
          - href: notes.qmd
            text: "Lecture 10 notes"
          - href: rosetta.qmd
            text: "Rosetta stone (Python ↔ R)"
          - href: stats.qmd
            text: "Lecture 11 notes"
          - href: data.qmd
            text: "Lab 1 data"
      - href: lab2.qmd
        text: "Lab 2"
      - href: setup.qmd
        text: Setup
  page-footer:
    left: "Genomic Data Science · DATA405/BIOL480 · Jinrui Xu · Howard University · Fall 2026"
    right: "Code runs in your browser (Pyodide + webR). Nothing is uploaded."

format:
  live-html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-copy: true
    css: styles.css
    include-after-body: lang-switch.html
    webr:
      render-df: paged-table
    pyodide:
      packages:
        - pandas
        - numpy
        - scipy
        - matplotlib
    live:
      show-hints: true
      show-solutions: true

engine: markdown
